name: CI/CD Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.distribution.name }} APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - id: standard
            name: Standard
            gradle: Standard
            dir: standard
            abis: arm64-v8a
            package: apk
    env:
      MEASURE_API_KEY: ${{ secrets.MEASURE_API_KEY }}
      DISTRIBUTION: ${{ matrix.distribution.id }}
      GRADLE_FLAVOR: ${{ matrix.distribution.gradle }}
      APK_DIR: ${{ matrix.distribution.dir }}
      APK_ABIS: ${{ matrix.distribution.abis }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Play Store version codes, BuildConfig.GIT_COUNT and preview identities need full history.
          fetch-depth: 0

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew "assemble${GRADLE_FLAVOR}Release" -PexperimentalBuild=true --stacktrace --no-daemon --max-workers=2

      - name: Compile artwork regressions and performance capture
        run: ./gradlew :app:compileStandardDebugAndroidTestKotlin :baselineprofile:compileStandardNonMinifiedReleaseKotlin -PtargetAbi=arm64-v8a --stacktrace --no-daemon --max-workers=2

      - name: Report APK contents
        run: |
          python3 scripts/report_android_size.py --json size-report.json --markdown size-report.md
          cat size-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive size report
        uses: actions/upload-artifact@v7
        with:
          name: size-report-${{ matrix.distribution.id }}
          path: |
            size-report.json
            size-report.md

      - name: Sign APKs when signing secrets are available
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          test -x "$apksigner"

          if [[ -z "$SIGNING_KEYSTORE" ]]; then
            echo "SIGNING_KEYSTORE is unavailable (expected for untrusted fork PRs); keeping CI APKs unsigned."
            exit 0
          fi

          if [[ -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "SIGNING_KEYSTORE exists but one or more required signing secrets are missing."
            exit 1
          fi

          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT

          # AGP only appends "-unsigned" when the variant has no signing config, so accept
          # either name and always re-sign with the release key.
          sign_apk() {
            local dir="$1"
            local base="$2"
            local label="$3"
            local signed="$dir/$base.apk"
            local unsigned="$dir/$base-unsigned.apk"
            local source=""

            if [[ -f "$unsigned" ]]; then
              source="$unsigned"
            elif [[ -f "$signed" ]]; then
              source="$signed"
            else
              echo "Missing expected $label APK: $unsigned (or $signed)"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            local staged="$dir/$base-signing.apk"
            rm -f "$staged"
            "$apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$staged" \
              "$source"
            "$apksigner" verify --verbose "$staged"
            rm -f "$unsigned"
            mv -f "$staged" "$signed"
          }

          out_dir="app/build/outputs/apk/${APK_DIR}/release"
          test -d "$out_dir"
          for abi in $APK_ABIS; do
            sign_apk "$out_dir" "app-${APK_DIR}-${abi}-release" "${APK_DIR} ${abi} release"
          done

      - name: Verify expected flavor outputs
        shell: bash
        run: |
          set -euo pipefail
          release_dir="app/build/outputs/apk/standard/release"
          architectures=(arm64-v8a)
          for abi in "${architectures[@]}"; do
            if ! compgen -G "$release_dir/app-standard-${abi}-release*.apk" >/dev/null; then
              echo "No standard release APK found for $abi"
              exit 1
            fi
          done

      - name: Upload R8 diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: r8-${{ matrix.distribution.id }}-${{ github.sha }}
          path: app/build/outputs/mapping/
          if-no-files-found: error
          retention-days: 30

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-arm64-v8a-release-${{ steps.metadata.outputs.short_sha }}
          path: app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

